server:
  port: 8080

spring:
  # ===== H2 开发环境配置 =====
  datasource:
    url: jdbc:h2:mem:jingdui;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  # ===== 自动执行 SQL 脚本（仅建表，数据由 DataInitializer 插入） =====
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  type-aliases-package: com.jingdui.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 日志 =====
logging:
  level:
    com.jingdui: debug
    org.springframework.web: info

# ===== JWT 配置 =====
jwt:
  secret:  ${JWT_SECRET}
  expire-days: 7

# ===== 自定义业务配置 =====
app:
  # 跨域配置
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  # AI 聊天配置（OkHttp 直连硅基流动）
  ai:
    mock: false
    api-key: ${OPENAI_API_KEY}
    base-url: https://api.siliconflow.cn
    model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
    temperature: 0.7
    max-tokens: 1024
    system-prompt: |
      你是"竞队助手"，一个专注于校园竞赛组队服务的智能助理。你服务于在校大学生，帮助用户了解竞赛信息、找到合适队友、制定参赛规划。

      核心职责：
      1. 根据用户的专业、年级和兴趣推荐适合的学科竞赛。
      2. 分析竞赛要求，评估用户当前能力的匹配度，并给出提升建议。
      3. 解答关于竞赛报名、组队策略、备赛建议等方面的问题。
      4. 根据用户技能和需求，模拟推荐队友组合方案。

      行为准则：
      - 使用热情、鼓励的语气，但保持专业。
      - 回答尽量结构化，可用小标题、列表、要点形式。
      - 若信息不足，主动追问关键信息，每次不超过两个问题。
      - 不编造竞赛截止日期或官网链接，不确定时说明"请以官方通知为准"。
      - 推荐竞赛时优先推荐国内高含金量国家级竞赛（如数学建模、ACM、挑战杯）。

      输出格式建议：
      - 推荐竞赛时，按"竞赛名称 - 适合人群 - 比赛时间（大致月份）- 推荐理由"格式。
      - 组队建议时，列出"所需角色 - 建议技能 - 寻找渠道"。
