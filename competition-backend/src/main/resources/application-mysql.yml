# ============================================
# MySQL 生产环境配置
# 使用方式：启动时指定 -Dspring.profiles.active=mysql
#   IDEA: Run Configuration → Active profiles → mysql
#   命令行: mvn spring-boot:run -Dspring.profiles.active=mysql
# ============================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jingdui?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never   # 生产环境由 Flyway 管理 DDL，禁止 Spring SQL Init 自动执行

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 生产关闭 SQL 日志

logging:
  level:
    com.jingdui: info
