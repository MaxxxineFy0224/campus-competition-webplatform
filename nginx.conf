# ========================================
# Nginx 配置 —— 校园竞赛组队平台
# 1. 托管 Vue 前端静态文件
# 2. /api 反向代理到后端 Spring Boot
# 3. SSE 流式响应特殊处理（proxy_buffering off）
# ========================================

upstream backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 访问日志格式（包含请求耗时）
    log_format timed '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time';

    access_log /var/log/nginx/access.log timed;

    # ====================================
    # 静态资源 —— Vue 前端
    # ====================================
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（带 hash 的文件名，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon / robots.txt 等根目录文件
    location = /favicon.ico { access_log off; expires 1d; }
    location = /robots.txt  { access_log off; expires 1d; }

    # ====================================
    # API 反向代理 —— 后端 Spring Boot
    # ====================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ======== SSE 流式响应处理 ========
        # 关闭 Nginx 缓冲，确保 SSE 数据实时推送到客户端
        proxy_buffering off;
        proxy_cache off;

        # SSE 长连接超时设置（60 秒，与后端 SseEmitter 一致）
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # 禁用 gzip 压缩 SSE 流
        gzip off;

        # 支持 Connection: keep-alive 和 Upgrade 头
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # ====================================
    # H2 控制台（非生产环境可关闭）
    # ====================================
    # location /h2-console {
    #     proxy_pass http://backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ====================================
    # Vue Router History 模式 —— SPA fallback
    # 所有非 API 非静态文件的请求都返回 index.html
    # ====================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====================================
    # 安全头
    # ====================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}