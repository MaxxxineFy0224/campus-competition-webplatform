# ========================================
# 校园竞赛组队平台 —— Docker Compose 编排
#
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f backend
# 重建: docker compose up -d --build
# ========================================

services:
  # ==========================================
  # MySQL 8.0 数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: competition-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jingdui
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 建表脚本（MySQL 容器首次启动时自动执行 /docker-entrypoint-initdb.d 下的 .sql 文件）
      - ./competition-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - competition-net

  # ==========================================
  # Spring Boot 后端
  # ==========================================
  backend:
    build:
      context: ./competition-backend
      dockerfile: Dockerfile
    container_name: competition-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Spring 配置
      SPRING_PROFILES_ACTIVE: mysql
      # 数据库连接（覆盖 application-mysql.yml 中的默认值）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jingdui?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET}
      # AI 配置
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # 跨域（生产环境 Nginx 域名）
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # JVM 参数
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - competition-net

  # ==========================================
  # Vue 前端（Nginx 托管）
  # ==========================================
  frontend:
    build:
      context: ./competition-frontend
      dockerfile: Dockerfile
    container_name: competition-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # 挂载自定义 Nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - competition-net

# ==========================================
# 数据卷（持久化 MySQL 数据）
# ==========================================
volumes:
  mysql_data:
    driver: local

# ==========================================
# 容器间网络
# ==========================================
networks:
  competition-net:
    driver: bridge